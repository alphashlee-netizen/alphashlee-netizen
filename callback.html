<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <style>
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .box { max-width: 400px; }
        .btn {
            display: inline-block;
            background: #00e5ff;
            color: #000;
            padding: 18px 40px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            margin-top: 24px;
            border: none;
            cursor: pointer;
        }
        h2 { margin-bottom: 8px; }
        p { color: #aaa; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="title">로그인 완료</h2>
        <p id="msg">아래 버튼을 눌러 앱으로 돌아가세요</p>
        <a id="link" class="btn" href="#">앱 열기</a>
    </div>
    <script>
        const params = new URLSearchParams(location.search);
        const code = params.get('code');

        if (!code) {
            document.getElementById('title').textContent = '오류';
            document.getElementById('msg').textContent = '코드가 없습니다';
            document.getElementById('link').style.display = 'none';
        } else {
            const url = 'myapp://callback?code=' + encodeURIComponent(code);
            document.getElementById('link').href = url;

            // 1.5초 후 자동 시도 (일부 브라우저는 됨)
            setTimeout(function () {
                window.location.href = url;
            }, 1500);
        }
    </script>
</body>
</html>
